[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cse431-financial-risk"
version = "0.1.0"
description = "Cost-Sensitive and Explainable Machine Learning for Financial Risk: Credit Card Fraud and Loan Default Prediction"
authors = [
    {name = "Shoumik Bala Somu", email = "shoumik.bala@gmail.com"},
    {name = "Md Israfil Hossen"},
    {name = "Ariyan Islam Hridoy"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "shap>=0.44.0",
    "optuna>=3.5.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "kagglehub>=0.2.0",
    "streamlit>=1.30.0",
    "nbformat>=5.9.0",
    "nbconvert>=7.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
